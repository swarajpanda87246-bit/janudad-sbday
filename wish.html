<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Happy Birthday, Papa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="night wish-page">

  <canvas id="confetti"></canvas>
  <div id="balloons"></div>

 
  <main class="center">
    <h1 class="big-title">Happy Birthday, Papa!</h1>

    <div class="photos">
      <figure class="photo one">
        <img src="images/1.jpg" alt="Papa in a pink checked shirt">
        <figcaption>My hero</figcaption>
      </figure>
      <figure class="photo two">
        <img src="images/2.jpg" alt="Papa wearing a cap and red jacket">
        <figcaption>My guide</figcaption>
      </figure>
    </div>

    <div class="wish-card">
      <p id="wish-text"></p>
    </div>

    <div class="buttons">
      <button id="more" class="btn">More celebration</button>
      <a class="btn outline" href="index.html">Open the gift again</a>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
