<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A surprise for Papa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="night">

  <canvas id="confetti"></canvas>
  <div id="balloons"></div>

  
  <main class="center">
    <h1 id="heading">Papa, this is for you</h1>

    <button id="gift" class="gift" aria-label="Open the gift">
      <div class="lid">
        <div class="bow"></div>
      </div>
      <div class="box"></div>
    </button>

    <p id="hint">Tap the gift to open it</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
